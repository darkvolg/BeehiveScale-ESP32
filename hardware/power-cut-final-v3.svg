<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Arial, sans-serif">
  <style>
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .lbl { font-size: 15px; font-weight: bold; fill: #000; }
    .pin { font-size: 12px; fill: #000; }
    .small { font-size: 11px; fill: #444; }
    .w { stroke: #000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: miter; }
    .junction { fill: #000; }
    .title { font-size: 18px; font-weight: bold; fill: #000; }
  </style>

  <text x="700" y="30" class="title" text-anchor="middle">BeehiveScale — Power-Cut Schematic</text>

  <!-- ════════════ COMPONENTS — GRID LAYOUT ════════════ -->

  <!-- COL 1: TP4056 (x=80) -->
  <rect x="80" y="100" width="140" height="120" class="box"/>
  <text x="150" y="135" class="lbl" text-anchor="middle">TP4056</text>
  <text x="150" y="155" class="small" text-anchor="middle">+ DW01</text>
  <text x="150" y="175" class="small" text-anchor="middle">charger</text>
  <text x="75" y="125" class="pin" text-anchor="end">IN+</text>
  <text x="75" y="150" class="pin" text-anchor="end">IN−</text>
  <text x="75" y="180" class="pin" text-anchor="end">B+</text>
  <text x="75" y="205" class="pin" text-anchor="end">B−</text>
  <text x="225" y="150" class="pin">OUT+</text>
  <text x="225" y="180" class="pin">OUT−</text>

  <!-- COL 2: 21700 (x=80, y=380) -->
  <rect x="80" y="380" width="140" height="80" class="box"/>
  <text x="150" y="410" class="lbl" text-anchor="middle">21700</text>
  <text x="150" y="430" class="small" text-anchor="middle">Li-Ion 3.7V</text>
  <text x="75" y="400" class="pin" text-anchor="end">B+</text>
  <text x="75" y="445" class="pin" text-anchor="end">B−</text>

  <!-- COL 2: SW1 toggle switch (x=350) -->
  <g transform="translate(350,140)">
    <rect width="80" height="40" class="box"/>
    <circle cx="15" cy="20" r="3" class="junction"/>
    <circle cx="65" cy="20" r="3" class="junction"/>
    <line x1="15" y1="20" x2="55" y2="8" class="w"/>
    <text x="40" y="-5" class="lbl" text-anchor="middle">SW1</text>
    <text x="40" y="55" class="small" text-anchor="middle">тумблер ON/OFF</text>
  </g>

  <!-- COL 3: AO3401 (x=580) — A19T pinout, Drain TOP -->
  <rect x="580" y="280" width="140" height="100" class="box"/>
  <text x="650" y="320" class="lbl" text-anchor="middle">AO3401</text>
  <text x="650" y="340" class="small" text-anchor="middle">P-MOSFET</text>
  <text x="650" y="358" class="small" text-anchor="middle">(A19T, SOT-23)</text>
  <!-- Drain TOP -->
  <text x="650" y="275" class="pin" text-anchor="middle">D (Drain) — Pin 3</text>
  <line x1="650" y1="280" x2="650" y2="260" class="w"/>
  <!-- Gate LEFT BOTTOM -->
  <text x="620" y="395" class="pin" text-anchor="middle">G</text>
  <line x1="620" y1="380" x2="620" y2="400" class="w"/>
  <!-- Source RIGHT BOTTOM -->
  <text x="680" y="395" class="pin" text-anchor="middle">S</text>
  <line x1="680" y1="380" x2="680" y2="400" class="w"/>

  <!-- COL 4: MT3608 (x=830) -->
  <rect x="830" y="280" width="140" height="100" class="box"/>
  <text x="900" y="320" class="lbl" text-anchor="middle">MT3608</text>
  <text x="900" y="340" class="small" text-anchor="middle">boost</text>
  <text x="900" y="358" class="small" text-anchor="middle">3.7→5V</text>
  <text x="825" y="305" class="pin" text-anchor="end">VIN+</text>
  <text x="825" y="360" class="pin" text-anchor="end">VIN−</text>
  <text x="975" y="305" class="pin">VOUT+</text>
  <text x="975" y="360" class="pin">VOUT−</text>

  <!-- COL 5: ESP32 (x=1100) -->
  <rect x="1100" y="200" width="180" height="240" class="box"/>
  <text x="1190" y="230" class="lbl" text-anchor="middle">ESP32 DOIT V1</text>
  <text x="1095" y="270" class="pin" text-anchor="end">VIN</text>
  <text x="1095" y="295" class="pin" text-anchor="end">GND</text>
  <text x="1095" y="325" class="pin" text-anchor="end">GPIO21</text>
  <text x="1095" y="350" class="pin" text-anchor="end">GPIO22</text>
  <text x="1095" y="385" class="pin" text-anchor="end">GPIO25</text>

  <!-- Peripherals -->
  <rect x="1100" y="470" width="180" height="50" class="box"/>
  <text x="1190" y="495" class="lbl" text-anchor="middle">LCD + HX711 + DS18B20</text>
  <text x="1190" y="513" class="small" text-anchor="middle">5V от MT3608</text>

  <!-- 100k pullup -->
  <g transform="translate(485,440)">
    <rect x="-12" y="0" width="24" height="50" class="box"/>
    <text x="-18" y="28" class="pin" text-anchor="end">100k</text>
    <text x="0" y="65" class="small" text-anchor="middle">pullup</text>
  </g>

  <!-- D1 diode -->
  <g transform="translate(540,560)">
    <line x1="-20" y1="10" x2="50" y2="10" class="w"/>
    <polygon points="15,3 15,17 28,10" class="box"/>
    <line x1="28" y1="3" x2="28" y2="17" class="w" stroke-width="2.5"/>
    <text x="15" y="-3" class="small" text-anchor="middle">D1 1N5819</text>
  </g>

  <!-- D2 diode -->
  <g transform="translate(540,620)">
    <line x1="-20" y1="10" x2="50" y2="10" class="w"/>
    <polygon points="15,3 15,17 28,10" class="box"/>
    <line x1="28" y1="3" x2="28" y2="17" class="w" stroke-width="2.5"/>
    <text x="15" y="-3" class="small" text-anchor="middle">D2 1N5819</text>
  </g>

  <!-- SW2 push-button WAKE -->
  <g transform="translate(540,680)">
    <line x1="-20" y1="10" x2="20" y2="10" class="w"/>
    <rect x="20" y="0" width="50" height="20" class="box"/>
    <circle cx="32" cy="10" r="2.5" class="junction"/>
    <circle cx="58" cy="10" r="2.5" class="junction"/>
    <path d="M 32,10 L 45,3 L 58,3" stroke="#000" stroke-width="2" fill="none"/>
    <line x1="70" y1="10" x2="100" y2="10" class="w"/>
    <text x="45" y="-3" class="small" text-anchor="middle">SW2 WAKE</text>
  </g>

  <!-- DS3231 -->
  <rect x="780" y="600" width="240" height="120" class="box"/>
  <text x="900" y="635" class="lbl" text-anchor="middle">DS3231 (ZS-042)</text>
  <text x="900" y="655" class="small" text-anchor="middle">+ CR2032 backup</text>
  <text x="1025" y="620" class="pin">VCC</text>
  <text x="1025" y="645" class="pin">GND</text>
  <text x="1025" y="670" class="pin">SDA</text>
  <text x="1025" y="695" class="pin">SCL</text>
  <text x="1025" y="720" class="pin">INT</text>

  <!-- ════════════ WIRES ════════════ -->

  <!-- TP4056 IN+ ← (charging input from solar/USB) -->
  <line x1="50" y1="120" x2="80" y2="120" class="w"/>
  <text x="40" y="124" class="small" text-anchor="end">+5V in</text>
  <line x1="50" y1="148" x2="80" y2="148" class="w"/>

  <!-- TP4056 B+ ↔ 21700+ -->
  <line x1="80" y1="180" x2="50" y2="180" class="w"/>
  <line x1="50" y1="180" x2="50" y2="395" class="w"/>
  <line x1="50" y1="395" x2="80" y2="395" class="w"/>

  <!-- TP4056 B- ↔ 21700- -->
  <line x1="80" y1="205" x2="30" y2="205" class="w"/>
  <line x1="30" y1="205" x2="30" y2="445" class="w"/>
  <line x1="30" y1="445" x2="80" y2="445" class="w"/>

  <!-- TP4056 OUT+ → SW1 left -->
  <line x1="220" y1="148" x2="350" y2="160" class="w"/>

  <!-- SW1 right → AO3401 Source -->
  <line x1="430" y1="160" x2="680" y2="160" class="w"/>
  <line x1="680" y1="160" x2="680" y2="400" class="w"/>

  <!-- AO3401 Drain → MT3608 VIN+ -->
  <line x1="650" y1="260" x2="780" y2="260" class="w"/>
  <line x1="780" y1="260" x2="780" y2="305" class="w"/>
  <line x1="780" y1="305" x2="830" y2="305" class="w"/>

  <!-- MT3608 VOUT+ → ESP VIN -->
  <line x1="970" y1="305" x2="1040" y2="305" class="w"/>
  <line x1="1040" y1="305" x2="1040" y2="270" class="w"/>
  <line x1="1040" y1="270" x2="1100" y2="270" class="w"/>
  <circle cx="1040" cy="305" r="3" class="junction"/>

  <!-- MT3608 VOUT+ → Periph (5V) -->
  <line x1="1040" y1="305" x2="1040" y2="490" class="w"/>
  <line x1="1040" y1="490" x2="1100" y2="490" class="w"/>

  <!-- DS3231 VCC ← AO3401 Source (after SW1) -->
  <line x1="680" y1="400" x2="745" y2="400" class="w"/>
  <line x1="745" y1="400" x2="745" y2="620" class="w"/>
  <line x1="745" y1="620" x2="1015" y2="620" class="w"/>
  <circle cx="680" cy="400" r="3" class="junction"/>

  <!-- 100k pullup: Gate ↔ Source -->
  <line x1="620" y1="400" x2="620" y2="440" class="w"/>
  <line x1="497" y1="465" x2="475" y2="465" class="w"/>
  <line x1="475" y1="465" x2="475" y2="430" class="w"/>
  <line x1="475" y1="430" x2="745" y2="430" class="w"/>
  <circle cx="745" cy="430" r="3" class="junction"/>
  <line x1="473" y1="465" x2="620" y2="465" class="w"/>
  <circle cx="620" cy="465" r="3" class="junction"/>
  <!-- pullup correct: top of R to Source line, bottom of R to Gate -->
  <line x1="485" y1="440" x2="485" y2="430" class="w"/>
  <line x1="485" y1="490" x2="485" y2="500" class="w"/>
  <line x1="485" y1="500" x2="620" y2="500" class="w"/>
  <circle cx="620" cy="500" r="3" class="junction"/>

  <!-- D1: anode → Gate, cathode → DS3231 INT -->
  <line x1="540" y1="570" x2="620" y2="570" class="w"/>
  <circle cx="620" cy="570" r="3" class="junction"/>
  <line x1="590" y1="570" x2="780" y2="570" class="w"/>
  <line x1="780" y1="570" x2="780" y2="720" class="w"/>
  <line x1="780" y1="720" x2="1015" y2="720" class="w"/>

  <!-- D2: anode → Gate, cathode → ESP GPIO25 -->
  <line x1="540" y1="630" x2="620" y2="630" class="w"/>
  <circle cx="620" cy="630" r="3" class="junction"/>
  <line x1="590" y1="630" x2="1060" y2="630" class="w"/>
  <line x1="1060" y1="630" x2="1060" y2="385" class="w"/>
  <line x1="1060" y1="385" x2="1100" y2="385" class="w"/>

  <!-- SW2 WAKE: Gate ↔ GND -->
  <line x1="540" y1="690" x2="620" y2="690" class="w"/>
  <circle cx="620" cy="690" r="3" class="junction"/>
  <line x1="640" y1="690" x2="660" y2="690" class="w"/>
  <line x1="660" y1="690" x2="660" y2="840" class="w"/>

  <!-- Gate vertical: top of Gate (at 400) down through all junctions to 500 -->
  <line x1="620" y1="400" x2="620" y2="690" class="w"/>

  <!-- I2C SDA: ESP GPIO21 ↔ DS3231 SDA -->
  <line x1="1100" y1="325" x2="1080" y2="325" class="w"/>
  <line x1="1080" y1="325" x2="1080" y2="670" class="w"/>
  <line x1="1080" y1="670" x2="1015" y2="670" class="w"/>

  <!-- I2C SCL: ESP GPIO22 ↔ DS3231 SCL -->
  <line x1="1100" y1="350" x2="1060" y2="350" class="w"/>
  <line x1="1060" y1="350" x2="1060" y2="385" class="w"/>
  <!-- conflict — separate path needed: SCL must take different route -->

  <!-- Re-route SCL: ESP GPIO22 (1100,350) → down → over to DS3231 SCL (1015,695) -->
  <line x1="1100" y1="350" x2="1090" y2="350" class="w"/>
  <line x1="1090" y1="350" x2="1090" y2="695" class="w"/>
  <line x1="1090" y1="695" x2="1015" y2="695" class="w"/>

  <!-- ═════════ GND BUS ═════════ -->
  <line x1="30" y1="840" x2="1280" y2="840" class="w" stroke-width="3"/>
  <text x="20" y="845" class="pin" text-anchor="end">GND</text>

  <!-- TP4056 IN- → GND bus -->
  <line x1="50" y1="148" x2="50" y2="840" class="w"/>
  <circle cx="50" cy="840" r="3" class="junction"/>

  <!-- MT3608 VIN- → GND bus -->
  <line x1="830" y1="360" x2="810" y2="360" class="w"/>
  <line x1="810" y1="360" x2="810" y2="840" class="w"/>
  <circle cx="810" cy="840" r="3" class="junction"/>

  <!-- MT3608 VOUT- → GND bus -->
  <line x1="970" y1="360" x2="990" y2="360" class="w"/>
  <line x1="990" y1="360" x2="990" y2="840" class="w"/>
  <circle cx="990" cy="840" r="3" class="junction"/>

  <!-- DS3231 GND → GND bus -->
  <line x1="1015" y1="645" x2="1035" y2="645" class="w"/>
  <line x1="1035" y1="645" x2="1035" y2="840" class="w"/>
  <circle cx="1035" cy="840" r="3" class="junction"/>

  <!-- ESP GND → GND bus -->
  <line x1="1100" y1="295" x2="1070" y2="295" class="w"/>
  <line x1="1070" y1="295" x2="1070" y2="840" class="w"/>
  <circle cx="1070" cy="840" r="3" class="junction"/>

  <!-- Periph GND -->
  <line x1="1100" y1="515" x2="1050" y2="515" class="w"/>
  <line x1="1050" y1="515" x2="1050" y2="840" class="w"/>
  <circle cx="1050" cy="840" r="3" class="junction"/>

  <!-- SW2 WAKE → GND bus -->
  <circle cx="660" cy="840" r="3" class="junction"/>

</svg>
