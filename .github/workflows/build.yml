name: Build firmware

on:
  push:
    branches: [main, master, dev]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      firmware_path: ${{ steps.locate.outputs.firmware_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build release (d1_mini)
        run: pio run -e d1_mini

      - name: Build debug (d1_mini)
        run: pio run -e d1_mini-debug

      - name: Build nodemcuv2 (compat)
        run: pio run -e nodemcuv2

      - id: locate
        name: Locate firmware
        run: echo "firmware_path=.pio/build/d1_mini/firmware.bin" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifacts (CI runs)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/d1_mini/firmware.bin
            .pio/build/d1_mini/firmware.elf
            .pio/build/nodemcuv2/firmware.bin
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: artifacts/

      - name: Rename binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp artifacts/d1_mini/firmware.bin     "release/BeehiveScale-${VERSION}-d1_mini.bin"
          cp artifacts/nodemcuv2/firmware.bin   "release/BeehiveScale-${VERSION}-nodemcuv2.bin"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Прошивка BeehiveScale ${{ github.ref_name }}.

            Скачай нужный `.bin` и загрузи через Arduino IDE (Sketch → Upload Using Programmer),
            PlatformIO (`pio run -t upload`), либо OTA:
            ```
            espota.py -i 192.168.x.x -p 8266 --auth=<ota_pass> -f BeehiveScale-<version>-d1_mini.bin
            ```

            Подробности изменений — см. CHANGELOG.md.
