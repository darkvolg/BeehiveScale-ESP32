; BeehiveScale ESP32 — PlatformIO configuration
; Порт прошивки с ESP8266 (BeehiveScale-main) на ESP32-WROOM-32 DevKit.
; Причина перехода: ESP8266 не пробуждается из deep sleep на платах NodeMCU v0.1 / Lolin V3.
; ESP32 deep sleep работает железно из коробки (подтверждено WakeTestESP32 2026-05-05).
;
; Использование:
;   pio run -e esp32dev          — сборка
;   pio run -e esp32dev -t upload — прошивка через USB

[platformio]
default_envs = esp32dev
src_dir = BeehiveScale

; ───── Общие настройки ─────
[env]
framework = arduino
monitor_speed = 115200

; Библиотеки — те же что и на ESP8266, все совместимы с ESP32
lib_deps =
  bogde/HX711@^0.7.5
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/RTClib@^2.1.4
  bblanchon/ArduinoJson@^6.21.5

; ───── ESP32 DevKit (DOIT v1, 38 пинов) — основная плата ─────
[env:esp32dev]
platform = espressif32 @ ~6.5.0
board = esp32dev
upload_speed = 921600
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_flags =
  -D NDEBUG
  -Wall

; ───── ESP32 Debug сборка ─────
[env:esp32dev-debug]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -D BEEHIVE_DEBUG=1
build_type = debug

; ───── ESP32 OTA прошивка ─────
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
; PLATFORMIO_UPLOAD_PORT=192.168.x.x
; PLATFORMIO_UPLOAD_FLAGS=--auth=<ota_password>
